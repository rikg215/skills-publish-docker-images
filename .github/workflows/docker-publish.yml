name: Docker Publish # Workflow Name

on: # What event triggers this workflow & where
  push: # push event/action
    branches: # list of branches this that trigger the workflow
    - main
permissions: # setting permissions 
  contents: read # can read the repository contents
  packages: write # can push packages to GitHub Container Registry

jobs: # Defining jobs which are composed of steps and actions executed on a single runner
  build-and-push: # job name
    runs-on: ubuntu-latest # what flavor of runner the job will run on. Latest version of ubuntu selected.
    steps:
    - uses: actions/checkout@v6
    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        platforms: linux/amd64,linux/arm64
        tags: |
          ghcr.io/rikg215/skills-publish-docker-images/stackoverflown:main
          ghcr.io/rikg215/skills-publish-docker-images/stackoverflown:${{ github.sha }}